<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>招金鐵飯碗 線上點餐</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="color-scheme" content="light">
  <style>
    :root{
      /* 兩組主題色：可自行改色 */
      --brand:#0f172a;
      --card:#ffffff;
      --muted:#64748b;
      --ring:#e2e8f0;
      --cat-a:#242d47; /* 類別 A 標題色（鍋燒、喝湯、呷甜…） */
      --cat-b:#c9141a; /* 類別 B 標題色（呷飽飽、喝茶…） */
      --sold-badge:#e2e8f0;
    }
    .container-slim{max-width:1200px}
    .card{border-radius:1rem;background:var(--card);box-shadow:0 6px 20px rgba(2,8,23,.05);transition:transform .15s ease, box-shadow .15s ease}
    .card:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(2,8,23,.08)}
    .btn{border-radius:1rem}
    .badge{border-radius:999px}
    .mono{font-variant-numeric:tabular-nums}
    input,select,textarea,option,button{color-scheme:light}
    input,select,textarea{
      background:#fff!important;color:#0f172a!important;-webkit-text-fill-color:#0f172a;border-color:#cbd5e1
    }
    select option{background:#fff;color:#0f172a}
    .scroll-y{overflow-y:auto;-webkit-overflow-scrolling:touch}
    .hidden-imp{display:none!important}
    .loading-wheel {width:48px;height:48px;border:4px solid #e2e8f0;border-top-color:#0f172a;border-radius:50%;animation:spin-loading .85s linear infinite}
    .button-wheel {display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin-loading .75s linear infinite;vertical-align:-2px;margin-right:7px}
    @keyframes spin-loading {to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce) {.loading-wheel,.button-wheel {animation-duration:2.5s}}

    /* 類別區塊標題：左側色條 + 圖示 + 標題 */
    .cat-header{display:flex;align-items:center;gap:.75rem}
    .cat-swatch{width:.4rem;height:1.5rem;border-radius:.25rem}
    .cat-a .cat-swatch{background:var(--cat-a)}
    .cat-b .cat-swatch{background:var(--cat-b)}
    .cat-a h2{color:var(--cat-a)}
    .cat-b h2{color:var(--cat-b)}
    .cat-wrap{display:flex;flex-direction:column;gap:.75rem}

    /* 商品卡片內的價錢與售完徽章區 */
    .item-price{font-weight:700}
    .sold-badge{background:var(--sold-badge);color:#475569}

    /* 選擇按鈕禁用態（售完） */
    .choose-btn[aria-disabled="true"]{opacity:.5;pointer-events:none}

    /* 成功視窗卡片 */
    #successModal .card{box-shadow:0 16px 40px rgba(15,23,42,.2)}

    /* 分類錨點區塊：讓捲動後卡在固定導覽下方剛好顯示 */
    .section-anchor{ scroll-margin-top: 128px; } /* 視實際 header/分類列高度可微調 */
    
    /* 隱藏水平卷軸（仍可左右滑） */
    .no-scrollbar::-webkit-scrollbar{ display:none; }
    .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }
    
    /* 分類按鈕選中狀態 */
    .catbtn.is-active{
      background:#0f172a;     /* slate-900 */
      color:#fff !important;  /* 被選中時反白 */
      border-color:#0f172a;
    }


  </style>
</head>

<body class="bg-slate-50 text-slate-900 selection:bg-slate-200 selection:text-slate-900">
<!-- 初次讀取／送單期間防止重複操作 -->
<div id="loadingOverlay" class="fixed inset-0 z-[100] flex items-center justify-center bg-white/95 backdrop-blur-sm" role="status" aria-live="polite" aria-busy="true">
  <div class="flex flex-col items-center gap-4 text-center px-6 max-w-md">
    <div id="loadingSpinner" class="loading-wheel" aria-hidden="true"></div>
    <h2 id="loadingTitle" class="text-xl font-semibold text-slate-900">正在載入菜單...</h2>
    <p id="loadingDescription" class="text-sm text-slate-500">正在取得最新商品與售完資訊，請稍候</p>
    <button id="retryMenuBtn" type="button" class="hidden btn px-5 py-2.5 bg-slate-900 text-white">重新讀取菜單</button>
    <button id="dismissOrderLoadingBtn" type="button" class="hidden btn px-4 py-2 border border-slate-300">隱藏提示（訂單仍在處理）</button>
  </div>
</div>
<div id="menuSyncIndicator" class="fixed bottom-4 right-4 z-20 hidden rounded-xl border border-slate-200 bg-white/95 px-3 py-2 text-xs text-slate-600 shadow-lg" role="status" aria-live="polite"></div>
<header class="sticky top-0 z-30 bg-white/80 backdrop-blur border-b border-slate-200">
  <div class="mx-auto container-slim px-4 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-slate-900 text-white rounded-xl grid place-items-center text-lg font-bold select-none">招</div>
      <div>
        <div class="text-xl font-semibold">招金鐵飯碗 線上點餐</div>
        <div class="text-xs text-slate-500">營業時間: 每週二至週五 16:00–19:30 </div>
      </div>
    </div>
    <a href="#cart" class="btn px-3 py-2 border border-slate-300 hover:bg-slate-100">購物車</a>
  </div>
</header>

<!-- 分類快速選擇列 -->
<nav id="categoryBar"
     class="sticky z-40 bg-white/90 backdrop-blur border-b border-slate-200">
  <div class="mx-auto container-slim px-4 py-2">
    <div class="flex gap-2 overflow-x-auto no-scrollbar">
      <button class="catbtn px-3 py-1.5 rounded-xl border border-slate-300 bg-white shrink-0" data-cat="chicken" style="color:#242d47">雞肉類</button>
      <button class="catbtn px-3 py-1.5 rounded-xl border border-slate-300 bg-white shrink-0" data-cat="pork" style="color:#c9141a">豬肉類</button>
      <button class="catbtn px-3 py-1.5 rounded-xl border border-slate-300 bg-white shrink-0" data-cat="side" style="color:#242d47">單點</button>
      <button class="catbtn px-3 py-1.5 rounded-xl border border-slate-300 bg-white shrink-0" data-cat="cold" style="color:#c9141a">涼拌小菜</button>
      <button class="catbtn px-3 py-1.5 rounded-xl border border-slate-300 bg-white shrink-0" data-cat="soup" style="color:#242d47">湯品</button>
    </div>
  </div>
</nav>



<main class="mx-auto container-slim px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
  <section class="lg:col-span-2 space-y-10">
    <p id="menuMessage" class="text-sm text-slate-500">正在讀取最新菜單…</p>
    <div class="cat-wrap cat-a" data-section="chicken">
      <div class="cat-header"><span class="cat-swatch"></span><h2 class="text-lg font-semibold">雞肉類</h2></div>
      <div id="chickenList" class="grid grid-cols-2 gap-4"></div>
    </div>
    <div class="cat-wrap cat-b" data-section="pork">
      <div class="cat-header"><span class="cat-swatch"></span><h2 class="text-lg font-semibold">豬肉類</h2></div>
      <div id="porkList" class="grid grid-cols-2 gap-4"></div>
    </div>
    <div class="cat-wrap cat-a" data-section="side">
      <div class="cat-header"><span class="cat-swatch"></span><h2 class="text-lg font-semibold">單點</h2></div>
      <div id="sideList" class="grid grid-cols-2 gap-4"></div>
    </div>
    <div class="cat-wrap cat-b" data-section="cold">
      <div class="cat-header"><span class="cat-swatch"></span><h2 class="text-lg font-semibold">涼拌小菜</h2></div>
      <div id="coldList" class="grid grid-cols-2 gap-4"></div>
    </div>
    <div class="cat-wrap cat-a" data-section="soup">
      <div class="cat-header"><span class="cat-swatch"></span><h2 class="text-lg font-semibold">湯品</h2></div>
      <div id="soupList" class="grid grid-cols-2 gap-4"></div>
    </div>
  </section>

  <aside id="cart"
    class="space-y-6 lg:sticky lg:top-[88px] lg:max-h-[calc(100vh-120px)] lg:overflow-y-auto lg:pr-1"
    style="-webkit-overflow-scrolling: touch;">
    <div class="card bg-white p-5">
      <h2 class="text-lg font-semibold mb-4">購物車</h2>
      <div id="cartItems" class="space-y-3"></div>
      <div class="border-t pt-4 mt-4 flex items-center justify-between text-lg font-semibold">
        <div>總計</div>
        <div id="cartTotal" class="mono">$0</div>
      </div>
      <button id="clearCart" class="mt-3 w-full btn px-4 py-2 border border-slate-300 hover:bg-slate-100">清空購物車</button>
    </div>

    <div class="card bg-white p-5">
      <h2 class="text-lg font-semibold mb-4">取餐資訊</h2>
      <form id="checkoutForm" class="space-y-4" autocomplete="off">
        <!-- 用餐方式 -->
        <div>
          <label class="text-sm text-slate-600">用餐方式</label>
          <div class="mt-2 grid grid-cols-2 gap-2">
            <label class="flex items-center gap-2 border rounded-xl px-3 py-2 cursor-pointer">
              <input type="radio" name="diningType" value="takeout" checked>
              <span>外帶</span>
            </label>
            <label class="flex items-center gap-2 border rounded-xl px-3 py-2 cursor-pointer">
              <input type="radio" name="diningType" value="dinein">
              <span>內用</span>
            </label>
          </div>
        </div>

        <!-- 外帶：取餐時間 -->
        <div id="takeoutBlock">
          <label class="text-sm text-slate-600">取餐時間（未選則自動安排最早可取時段）</label>
          <select id="pickupSelect"
                  class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 bg-white text-slate-900">
          </select>
          <p id="pickupHint" class="text-xs text-slate-500 mt-1">營業時段：每週二至週五 16:00–19:30；當日 00:00 開放預約。</p>
          <p id="offHourMsg" class="text-sm text-amber-700 mt-2 hidden-imp"></p>
        </div>

        <!-- 內用：桌號 -->
        <div id="dineinBlock" class="hidden">
          <label class="text-sm text-slate-600">桌號</label>
          <input id="tableNo" type="text" placeholder=""
                 class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 bg-white text-slate-900" />
        </div>

        <!-- 姓名/電話 -->
        <div>
          <label class="text-sm text-slate-600">姓名</label>
          <input required id="customerName" type="text"
                 class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 bg-white text-slate-900" />
        </div>
        <div>
          <label class="text-sm text-slate-600">電話</label>
          <input required id="customerPhone" type="tel" pattern="[0-9\-+\s]{8,}" placeholder="09xx-xxx-xxx"
                 class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 bg-white text-slate-900" />
        </div>

        <button id="submitBtn" type="submit" class="w-full btn px-4 py-3 bg-slate-900 text-white hover:bg-slate-800">送出訂單</button>
        <p id="formError" class="text-sm text-red-600"></p>
      </form>
    </div>
  </aside>
</main>

<!-- 成功視窗：依用餐方式條件顯示 -->
<div id="successModal" class="fixed inset-0 z-40 hidden">
  <div class="absolute inset-0 bg-black/40"></div>
  <div class="relative z-10 mx-auto mt-24 w-[92%] max-w-xl card bg-white p-6">
    <h3 class="text-xl font-semibold mb-4">下單成功</h3>

    <div class="space-y-2">
      <p class="text-slate-700">取餐編號</p>
      <p id="pickupNoText" class="text-4xl font-extrabold tracking-wider mt-1 mono"></p>
    </div>

    <!-- 外帶才顯示 -->
    <div id="successTakeoutTime" class="space-y-2 mt-4 hidden">
      <p class="text-slate-700">取餐時間</p>
      <p id="pickupTimeText" class="text-2xl font-bold mt-1 mono"></p>
    </div>

    <!-- 內用才顯示 -->
    <div id="successTable" class="space-y-2 mt-4 hidden">
      <p class="text-slate-700">桌號</p>
      <p id="tableNoText" class="text-2xl font-bold mt-1 mono"></p>
    </div>

    <div class="mt-6 flex justify-end">
      <button id="closeSuccess" class="btn px-4 py-2 border border-slate-300 hover:bg-slate-100">關閉</button>
    </div>
  </div>
</div>

<footer class="border-t border-slate-200 mt-12">
  <div class="mx-auto container-slim px-4 py-6 text-sm text-slate-600">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div>© <span id="year"></span> 招金</div>
    </div>
  </div>
</footer>

<script>
/* === 設定（請替換為你的 GAS 部署網址 / API Key）=== */
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwtbWiGbtR2Z1sb6c3hd6T4ScSrVNXHPj2ONKeHMOwBz2dUjPZpApuZxXRupHTRD-2wDw/exec';
const API_KEY  = 'zhaojin';

// 測試版：true = 暫時忽略星期限制；false = 恢復週二至週五營業。
// 仍只允許當日16:00至19:30取餐，19:30後停止接單。
const TEST_IGNORE_BUSINESS_DAYS = false;

/* === 工具 & 狀態 === */
const el = s => document.querySelector(s);
const money = n => '$' + Number(n||0).toLocaleString('zh-Hant');
const pad2 = n => String(n).padStart(2, '0');
const state = { cart: [], slots: [] };
const MENU_STORAGE_KEY = 'zhaojin_menu_cache_v1';
const MENU_STORAGE_MAX_AGE = 5 * 60 * 1000;
let menuReady = false;
let menuFetchInFlight = null;
let menuRefreshInFlight = null;
let syncHintTimer = null;

function showLoading(title, description, {retry=false, cancel=false} = {}) {
  el('#loadingTitle').textContent = title;
  el('#loadingDescription').textContent = description;
  el('#loadingSpinner').classList.toggle('hidden', retry);
  el('#retryMenuBtn').classList.toggle('hidden', !retry);
  el('#dismissOrderLoadingBtn').classList.toggle('hidden', !cancel);
  el('#loadingOverlay').classList.remove('hidden');
  el('#loadingOverlay').setAttribute('aria-busy', retry ? 'false' : 'true');
}
function hideLoading(){ el('#loadingOverlay').classList.add('hidden'); }
function showMenuSync(text, type='info') {
  const box = el('#menuSyncIndicator');
  box.textContent = text;
  box.classList.remove('hidden');
  box.style.borderColor = type === 'error' ? '#fca5a5' : '#e2e8f0';
  if (syncHintTimer) clearTimeout(syncHintTimer);
  syncHintTimer = setTimeout(()=>box.classList.add('hidden'), type === 'error' ? 6500 : 1800);
}
function readMenuCache(){
  try {
    const saved = JSON.parse(sessionStorage.getItem(MENU_STORAGE_KEY) || 'null');
    return saved && Array.isArray(saved.items) && Date.now()-saved.ts < MENU_STORAGE_MAX_AGE ? saved : null;
  } catch { return null; }
}
function writeMenuCache(items){
  try { sessionStorage.setItem(MENU_STORAGE_KEY, JSON.stringify({ts:Date.now(), items})); }catch{}
}


/* 新增：API 錯誤訊息對應（paused → 目前商家停止接單） */
function mapApiError(errCode, serverMessage){
  const code = String(errCode || '').toLowerCase();
  if (code === 'paused') return '目前商家停止接單';
  if (code === 'closed_day') return '今日非營業日，每週二至週五營業。';
  if (code === 'closed_time') return '今日已停止接單。';
  return serverMessage || '送單失敗，請稍後再試';
}

/* === 參數：營業時間 === */
const BUSINESS = {
  openDays: [2, 3, 4, 5], // JS: 星期日=0，星期二=2
  startHour: 16,
  startMinute: 0,
  endHour: 19,
  endMinute: 30,
  intervalMin: 15
};

/* === 菜單由 Google Sheets 的 menu 分頁即時讀取 === */
const MENU_CATEGORIES = [
  { key:'chicken', label:'雞肉類' },
  { key:'pork', label:'豬肉類' },
  { key:'side', label:'單點' },
  { key:'cold', label:'涼拌小菜' },
  { key:'soup', label:'湯品' }
];
const MENU = { chicken:[], pork:[], side:[], cold:[], soup:[] };
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
})[ch]);

/* === Render：分類卡片（保留結構與 id，不動你的流程） === */
function renderCategory(list, targetId){
  const root = el(targetId); root.innerHTML='';
  list.forEach(item=>{
    const card=document.createElement('div');
    card.className='card bg-white p-4 flex flex-col';
    card.innerHTML=`
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h3 class="text-base lg:text-lg font-semibold truncate">${escapeHtml(item.name)}</h3>
        </div>
        <div class="text-right item-price mono">${money(item.price)}</div>
      </div>
      <div class="mt-4 flex justify-end">
        <button class="choose-btn btn px-4 py-2 bg-slate-900 text-white hover:bg-slate-800"
                data-name="${escapeHtml(item.name)}">
          選擇
        </button>
      </div>`;
    card.querySelector('.choose-btn').addEventListener('click', ()=> openItemModal(item));
    root.appendChild(card);
  });
}

/* === 選項彈窗（僅鍋燒系列顯示主食，其餘只有數量與備註） === */
let currentItem = null;
function openItemModal(item){
  const chooseBtn = Array.from(document.querySelectorAll('.choose-btn'))
    .find(btn => btn.dataset.name === item.name);
  if (chooseBtn?.disabled) return;
  if (chooseBtn) {chooseBtn.disabled = true; chooseBtn.textContent = '確認中...';}
  // 再次檢查是否售完（避免 race）
  checkSoldOutByName(item.name).then(sold=>{
    if (sold) {
      alert('此品項已售完');
      refreshSheetMenu(true); // 立刻刷新按鈕狀態
      return;
    }
    currentItem = item;
    ensureItemModal();
    document.body.classList.add('overflow-hidden');

    el('#pmTitle').textContent = item.name;

    const needStaple = false; // 新菜單沒有鍋燒主食選擇
    el('#pmStapleWrap').style.display = 'none';

    el('#pmRemark').value = '';

    const qtyInput = el('#pmQty'); qtyInput.value = 1;
    const updatePmSubtotal = ()=>{
      const qty = Math.max(1, parseInt(qtyInput.value)||1);
      const subtotal = item.price * qty;
      el('#pmSubtotal').textContent = money(subtotal);
    };
    el('#pmDec').onclick = ()=>{ qtyInput.value = Math.max(1, (parseInt(qtyInput.value)||1) - 1); updatePmSubtotal(); };
    el('#pmInc').onclick = ()=>{ qtyInput.value = (parseInt(qtyInput.value)||1) + 1; updatePmSubtotal(); };
    qtyInput.oninput = updatePmSubtotal;
    updatePmSubtotal();

    el('#pmAdd').onclick = async ()=>{
      const addBtn = el('#pmAdd');
      if (addBtn.disabled) return;
      addBtn.disabled = true; addBtn.textContent = '加入中...';
      try {
      const sold = await checkSoldOutByName(item.name);
      if (sold) { alert('此品項已售完'); refreshSheetMenu(true); return; }
      const qty    = Math.max(1, parseInt(qtyInput.value)||1);
      const staple = needStaple ? el('#pmStaple').value : '';
      const remark = (el('#pmRemark')?.value || '').trim();
      addToCart({ item, qty, remark, staple, needStaple });
      closeItemModal();
      } catch(err) { alert('無法確認商品狀態，請稍後重試。'); }
      finally { addBtn.disabled = false; addBtn.textContent = '加入購物車'; }
    };

    el('#itemModal').classList.remove('hidden');
  }).catch(() => alert('無法確認商品狀態，請稍後再試。'))
    .finally(()=>{ if(chooseBtn){chooseBtn.disabled=false; chooseBtn.textContent='選擇';} });
}
function closeItemModal(){
  el('#itemModal')?.classList.add('hidden');
  document.body.classList.remove('overflow-hidden');
}
function ensureItemModal(){
  if (el('#itemModal')) return;
  const wrap = document.createElement('div');
  wrap.id = 'itemModal';
  wrap.className = 'fixed inset-0 z-40 hidden scroll-y';
  wrap.innerHTML = `
    <div class="absolute inset-0 bg-black/40"></div>
    <div class="relative z-10 min-h-full flex items-start justify-center py-6 px-3">
      <div class="w-full max-w-2xl card bg-white p-6 max-h-[85vh] scroll-y">
        <div class="flex items-start justify-between">
          <div class="min-w-0">
            <h3 id="pmTitle" class="text-xl font-semibold"></h3>
          </div>
          <button id="pmClose" class="btn px-3 py-2 border border-slate-300 hover:bg-slate-100">關閉</button>
        </div>

        <div id="pmStapleWrap" class="mt-4">
          <label class="text-sm text-slate-600">主食</label>
          <select id="pmStaple" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 bg-white text-slate-900"></select>
        </div>

        <div class="mt-5">
          <label class="text-sm text-slate-600">備註（選填）</label>
          <textarea id="pmRemark" rows="2"
            class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 bg-white text-slate-900"
            placeholder=""></textarea>
        </div>

        <div class="mt-5">
          <label class="text-sm text-slate-600">數量</label>
          <div class="mt-1 flex items-center gap-2">

/* === 外帶：僅營業日當日 00:00 起，16:00–19:30 每 15 分鐘可取餐 === */
function generateSlots(dateObj = new Date()) {
  const now = new Date();
  if (!TEST_IGNORE_BUSINESS_DAYS && !BUSINESS.openDays.includes(dateObj.getDay())) return [];
  // 不開放跨日預約
  if (dateObj.toDateString() !== now.toDateString()) return [];

  const y = dateObj.getFullYear(), m = dateObj.getMonth(), d = dateObj.getDate();
  const start = new Date(y, m, d, BUSINESS.startHour, BUSINESS.startMinute);
  const end = new Date(y, m, d, BUSINESS.endHour, BUSINESS.endMinute);
  const slots = [];
  const interval = BUSINESS.intervalMin * 60000;
  for (let ms = start.getTime(); ms <= end.getTime(); ms += interval) {
    if (ms >= now.getTime()) slots.push(new Date(ms));
  }
  return slots;
}
function fillPickupSelect() {
  const sel = el('#pickupSelect');
  const offMsg = el('#offHourMsg');
  const previousValue = sel.value;
  sel.innerHTML = '';
  state.slots.forEach(dt => {
    const o = document.createElement('option');
    o.value = dt.toISOString();
    o.textContent = `${pad2(dt.getHours())}:${pad2(dt.getMinutes())}`;
    sel.appendChild(o);
  });
  const auto = document.createElement('option');
  auto.value = '';
  auto.textContent = '（不指定，系統自動安排最早時段）';
  sel.insertBefore(auto, sel.firstChild);
  sel.value = [...sel.options].some(o => o.value === previousValue) ? previousValue : '';

  const isBusinessDay = TEST_IGNORE_BUSINESS_DAYS || BUSINESS.openDays.includes(new Date().getDay());
  const pickupHint = el('#pickupHint');
  if (pickupHint) pickupHint.textContent = TEST_IGNORE_BUSINESS_DAYS
    ? '測試模式：今日可選16:00–19:30的未過期時段（每15分鐘）。'
    : '每週二至週五，當日00:00開放預約；取餐16:00–19:30。';
  const hasSlots = state.slots.length > 0;
  sel.disabled = !hasSlots;
  if (!hasSlots) {
    sel.innerHTML = '';
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = isBusinessDay ? '今日已停止接單' : '今日非營業日';
    sel.appendChild(opt);
  }
  offMsg.classList.toggle('hidden-imp', hasSlots);
  if (!hasSlots) {
    offMsg.textContent = isBusinessDay
      ? '今日已無可預約的取餐時段。'
      : '今日非營業日；僅每週二至週五開放當日預約。';
  }
}
function chooseEarliestSlot(now = new Date()) {
  return state.slots.find(s => s.getTime() >= now.getTime()) || null;
}

/* === Google Sheets 菜單、售完與上下架狀態：每30秒同步 === */
let MENU_CACHE = { ts:0, byName:new Map(), items:[] };
const SOLDOUT_TTL_MS = 30 * 1000;

async function fetchMenuStatus(force=false) {
  const now = Date.now();
  if (!force && now - MENU_CACHE.ts < SOLDOUT_TTL_MS) return MENU_CACHE;
  if (menuFetchInFlight) return menuFetchInFlight;
  menuFetchInFlight = (async () => {
  const url = `${ENDPOINT}?action=menu&apiKey=${encodeURIComponent(API_KEY)}&_=${now}`;
  const response = await fetch(url, {cache:'no-store'});
  if (!response.ok) throw new Error('菜單連線失敗');
  const data = await response.json();
  if (!data.ok || !Array.isArray(data.items)) {
    throw new Error(data.message || data.error || '讀取菜單失敗');
  }
  const items = data.items.map((it, index) => ({
    id: String(it.sku || it.name || ''),
    name: String(it.name || '').trim(),
    price: Number(it.price),
    category: String(it.category || '').trim().toLowerCase(),
    soldOut: it.soldOut === true || String(it.soldOut).toUpperCase() === 'TRUE',
    available: it.available !== false && String(it.available).toUpperCase() !== 'FALSE',
    sortOrder: Number.isFinite(Number(it.sortOrder)) && it.sortOrder !== '' ? Number(it.sortOrder) : index
  })).filter(it => it.name && Number.isFinite(it.price) && it.price >= 0);
  const byName = new Map(items.map(it => [it.name,it]));
  MENU_CACHE = { ts:Date.now(), items, byName };
  writeMenuCache(items);
  return MENU_CACHE;
  })();
  try { return await menuFetchInFlight; }
  finally { menuFetchInFlight = null; }
}

function renderSheetMenu(items) {
  for (const category of MENU_CATEGORIES) MENU[category.key] = [];
  for (const item of items) {
    if (MENU[item.category] && item.available) MENU[item.category].push(item);
  }
  for (const category of MENU_CATEGORIES) {
    MENU[category.key].sort((a,b) => a.sortOrder - b.sortOrder);
    const section = document.querySelector(`[data-section="${category.key}"]`);
    if (section) section.classList.toggle('hidden', MENU[category.key].length === 0);
    renderCategory(MENU[category.key], `#${category.key}List`);
  }
  const message = el('#menuMessage');
  if (message) {
    message.textContent = items.length ? '' : '目前沒有上架商品。';
    message.classList.toggle('hidden', items.length > 0);
  }
  enforceSoldOutOnMenu();
}

async function refreshSheetMenu(force=false, {initial=false} = {}) {
  if (menuRefreshInFlight) return menuRefreshInFlight;
  menuRefreshInFlight = (async () => {
    if (initial && !menuReady) {
      showLoading('正在載入菜單...', '正在取得最新商品與售完資訊，請稍候');
    } else if (!initial) {
      showMenuSync('正在更新菜單...');
    }
    try {
      const {items} = await fetchMenuStatus(force);
      renderSheetMenu(items);
      menuReady = true;
      if (initial) hideLoading();
      else showMenuSync('菜單已更新');
      return true;
    } catch (err) {
      console.error('讀取菜單失敗', err);
      const message = el('#menuMessage');
      if (message) {
        message.textContent = '菜單更新失敗，請稍後重試。';
        message.classList.remove('hidden');
      }
      // 網路中斷時禁止選購，避免依靠舊價格或售完狀態繼續點餐。
      document.querySelectorAll('.choose-btn').forEach(btn => btn.disabled = true);
      if (initial && !menuReady) {
        showLoading('菜單載入失敗', '網路可能不穩定，請按下方按鈕重新載入。', {retry:true});
      } else {
        showMenuSync('菜單更新失敗，請稍後重試', 'error');
      }
      return false;
    }
  })();
  try { return await menuRefreshInFlight; }
  finally { menuRefreshInFlight = null; }
}

async function checkSoldOutByName(name) {
  const {byName} = await fetchMenuStatus(true);
  const item = byName.get(name);
  return !item || !item.available || item.soldOut;
}

function enforceSoldOutOnMenu() {
  document.querySelectorAll('.choose-btn').forEach(btn => {
    const item = MENU_CACHE.byName.get(btn.dataset.name || '');
    const sold = !item || item.soldOut || !item.available;
    btn.classList.toggle('hidden', sold);
    const wrap = btn.parentElement;
    if (!wrap) return;
    let badge = wrap.querySelector('.sold-pill');
    if (sold && !badge) {
      badge = document.createElement('span');
      badge.className = 'sold-pill inline-flex items-center justify-center px-4 py-2 rounded-xl border border-slate-300 bg-slate-100 text-slate-500';
      badge.textContent = '售完';
      wrap.insertBefore(badge, btn);
    } else if (!sold && badge) badge.remove();
  });
}

/* === 小工具：顯示 HH:mm === */
function hhmmFromISO(iso){
  if (!iso) return '';
  // GAS 回傳台灣時間字串 yyyy/MM/dd HH:mm:ss；直接抓 HH:mm 避免不同瀏覽器解析差異
  const taiwanText = String(iso).match(/^\d{4}\/\d{2}\/\d{2}\s+(\d{2}:\d{2})/);
  if (taiwanText) return taiwanText[1];
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

/* === Submit === */
async function onSubmitOrder(e) {
  e.preventDefault();
  const btn = el('#submitBtn');
  if (btn.disabled) return;
  const setBusy = b => { btn.disabled = b; btn.innerHTML = b ? '<span class="button-wheel"></span>送出中…' : '送出訂單'; };
  const showErr = m => el('#formError').textContent = m;
  setBusy(true); showErr('');

  try {
    const hasPending = !!readPendingOrder();
    if (!hasPending && state.cart.length === 0) { showErr('購物車尚無商品。'); return; }
    const name = el('#customerName').value.trim();
    const phone = el('#customerPhone').value.trim();
    if (!hasPending && (!name || !phone)) { showErr('請完整填寫姓名與電話。'); return; }

    const diningType = document.querySelector('input[name="diningType"]:checked')?.value || 'takeout';
    const tableNo = diningType === 'dinein' ? el('#tableNo').value.trim() : '';
    if (!hasPending && diningType === 'dinein' && !tableNo) { showErr('請填寫桌號。'); return; }

    const userChosenISO = (diningType === 'takeout' && el('#pickupSelect').value) ? el('#pickupSelect').value : '';
    const autoSlot = (diningType === 'takeout' && !userChosenISO) ? chooseEarliestSlot() : null;
    const pickupAtHintISO = (userChosenISO || (autoSlot ? autoSlot.toISOString() : ''));
    if (!hasPending && !TEST_IGNORE_BUSINESS_DAYS && !BUSINESS.openDays.includes(new Date().getDay())) {
      showErr('今日非營業日，每週二至週五營業。'); return;
    }
    if (!hasPending && diningType === 'takeout' && !pickupAtHintISO) {
      showErr('今日沒有可預約的取餐時段。'); return;
    }
    // 內用依原本桌號流程，但不得超過當日 19:30 再下單
    const closing = new Date();
    closing.setHours(BUSINESS.endHour, BUSINESS.endMinute, 0, 0);
    if (!hasPending && new Date() > closing) { showErr('今日已停止接單。'); return; }

    // 檢查取餐時間是否早於創建時間
    const createdAt = new Date();
    const selectedPickupTime = pickupAtHintISO ? new Date(pickupAtHintISO) : createdAt;
    if (!hasPending && selectedPickupTime < createdAt) {
      showErr('取餐時間不能早於訂單創建時間。');
      return;
    }

    showLoading('正在建立訂單...', '確認商品與寫入訂單中，請勿重複點擊或關閉網頁。', {cancel:false});
    let pending = readPendingOrder();
    if (!pending) {
      // 下單驗證統一交由 GAS submit_order，避免額外 GET menu 請求。
      const items = state.cart.map(e => {
        const staplePart = e.needStaple ? `｜主食：${e.staple || '-'}` : '';
        const remarkPart = e.remark ? `｜備註：${e.remark}` : '';
        const nameWith = `${e.item.name}${staplePart}${remarkPart}`;
        return { id: e.item.id, name: nameWith, price: e.item.price, qty: e.qty };
      });
      const subtotal = items.reduce((s, it) => s + it.price * it.qty, 0);
      const orderId = (crypto?.randomUUID?.() || (Date.now()+'-'+Math.random().toString(16).slice(2)));
      pending = {
        order: {
          orderId, customer: { name, phone }, items,
          subtotal, total: subtotal, createdAt: createdAt.toISOString(),
          source: 'zhaojin-web', diningType, tableNo: tableNo || null,
          desiredPickupTime: diningType === 'takeout' ? pickupAtHintISO : null
        },
        pickupAtHintISO, diningType, tableNo, reservation: null
      };
      savePendingOrder(pending);
    }

    const order = pending.order;
    // 單次 API：GAS 直接確認寫入正式 order，成功才顯示號碼。
    // 任何連線中斷保留相同 orderId，重新點擊不會生成另一筆。
    const res = await apiFastSubmit(order);
    if(!res.ok || res.status !== 'committed') {
      showErr(mapApiError(res.error,res.message) +
        '；如果已送出但畫面未完成，請勿清除購物車，直接按送出重試。');
      return;
    }
    el('#pickupNoText').textContent = String(res.pickupNo ?? '');
    if (order.diningType === 'takeout') {
      el('#successTakeoutTime').classList.remove('hidden');
      el('#successTable').classList.add('hidden');
      el('#pickupTimeText').textContent = hhmmFromISO(res.pickupTime || order.desiredPickupTime);
    } else {
      el('#successTakeoutTime').classList.add('hidden');
      el('#successTable').classList.remove('hidden');
      el('#tableNoText').textContent = order.tableNo || '';
    }
    el('#successModal').classList.remove('hidden');
    clearPendingOrder();
    state.cart = []; renderCart();

  } catch (err) {
    el('#formError').textContent = '送單失敗：' + (err?.message || '請稍後再試');
  } finally { setBusy(false); hideLoading(); }
}

/* ===== 分類快速選擇：錨點、捲動、著色、選中狀態 ===== */
const CATEGORY_SECTIONS = [
  { key:'chicken', label:'雞肉類', listSel:'#chickenList', color:'#242d47' },
  { key:'pork', label:'豬肉類', listSel:'#porkList', color:'#c9141a' },
  { key:'side', label:'單點', listSel:'#sideList', color:'#242d47' },
  { key:'cold', label:'涼拌小菜', listSel:'#coldList', color:'#c9141a' },
  { key:'soup', label:'湯品', listSel:'#soupList', color:'#242d47' },
];

/* 幫每個分類標題加錨點（不改你原 HTML 結構） */
/* 幫每個分類標題加錨點（符合你現在的 .cat-wrap / .cat-header 結構） */
function ensureCategoryAnchors(){
  CATEGORY_SECTIONS.forEach(({ key, listSel })=>{
    const list = document.querySelector(listSel);
    if (!list) return;

    // 你的結構：list 前面是 .cat-header，真正的 <h2> 在裡面
    const headerDiv = list.previousElementSibling;
    const h2 = headerDiv?.querySelector('h2');

    // 優先把錨點放在 <h2>，沒有再退而求其次放在整個 cat-wrap 或 list 本身
    const anchorEl =
      h2 ||
      list.closest('.cat-wrap') ||
      list;

    if (!anchorEl.id) anchorEl.id = `sec-${key}`;
    anchorEl.classList.add('section-anchor');
  });
}


/* 計算頂端固定區塊高度（header + 分類列）作為捲動補償 */
function getScrollOffsetPx(){
  const header = document.querySelector('header');
  const bar    = document.querySelector('#categoryBar');
  return (header?.offsetHeight || 0) + (bar?.offsetHeight || 0) + 8;
}

/* 平滑捲動到指定分類（用絕對座標，避免部分瀏覽器對 scrollIntoView 的 sticky 偏移問題） */
function scrollToCategory(key){
  const sec = document.getElementById(`sec-${key}`);
  if (!sec) return;
  const top = sec.getBoundingClientRect().top + window.pageYOffset - getScrollOffsetPx();
  window.scrollTo({ top, behavior:'smooth' });
}

/* 設定分類按鈕著色（字色依類別；選中時反白） */
function paintCategoryButtons(){
  const btns = document.querySelectorAll('#categoryBar .catbtn');
  btns.forEach(btn=>{
    const conf = CATEGORY_SECTIONS.find(x=>x.key === btn.dataset.cat);
    if (conf) btn.style.color = conf.color;
  });
}

/* 點擊綁定 */
function bindCategoryClicks(){
  document.querySelectorAll('#categoryBar .catbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.cat;
      scrollToCategory(key);
      // 立即高亮（之後還會被觀察者覆蓋成正確狀態）
      document.querySelectorAll('#categoryBar .catbtn').forEach(b=>b.classList.remove('is-active'));
      btn.classList.add('is-active');
    });
  });
}

/* 監看捲動，自動高亮當前分類 */
function observeActiveCategory(){
  const buttons = Array.from(document.querySelectorAll('#categoryBar .catbtn'));
  const mapBtn  = Object.fromEntries(buttons.map(b => [b.dataset.cat, b]));

  const io = new IntersectionObserver(entries=>{
    // 找到目前「最靠近頂部」且可見的錨點
    const visible = entries
      .filter(e => e.isIntersecting)
      .sort((a,b)=> a.boundingClientRect.top - b.boundingClientRect.top);
    if (!visible.length) return;
    const key = (visible[0].target.id || '').replace(/^sec-/,'');
    if (mapBtn[key]) {
      buttons.forEach(b=>b.classList.remove('is-active'));
      mapBtn[key].classList.add('is-active');
    }
  }, { root:null, rootMargin:`-${getScrollOffsetPx()+10}px 0px -60% 0px`, threshold:0 });

  CATEGORY_SECTIONS.forEach(({ key })=>{
    const anchor = document.getElementById(`sec-${key}`);
    if (anchor) io.observe(anchor);
  });
}

/* 讓分類列永遠貼在 header 下方（動態量 header 高度） */
function stickCategoryBar(){
  const header = document.querySelector('header');
  const bar = document.getElementById('categoryBar');
  if (!header || !bar) return;
  bar.style.top = (header.offsetHeight || 0) + 'px';
}

// 第一次載入、視窗尺寸改變、header 高度變動時都重算
window.addEventListener('load', stickCategoryBar);
window.addEventListener('resize', stickCategoryBar);
{
  const header = document.querySelector('header');
  if (header && 'ResizeObserver' in window) {
    const ro = new ResizeObserver(()=> stickCategoryBar());
    ro.observe(header);
  }
}


</script>
